<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comezze — Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #F2F7EF;
      --bark:       #2D3512;
      --lime:       #A6E22E;
      --terracotta: #5E7A12;
      --error:      #C23A00;
      --white:      #FFFFFF;
    }

    body {
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      color: var(--bark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      border-bottom: 1px solid rgba(45,53,18,0.12);
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      line-height: 1;
    }
    .logo .co    { color: var(--bark); }
    .logo .mezze { color: var(--terracotta); }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 2rem 4rem;
    }

    /* HEADER BLOCK */
    .contact-header {
      text-align: center;
      max-width: 620px;
      margin-bottom: 2rem;
    }
    .section-label {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--bark);
      font-weight: 700;
      display: block;
      margin-bottom: 1.2rem;
    }
    .contact-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: min(3.2rem, 7.2vw);
      white-space: nowrap;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      margin-bottom: 1.1rem;
    }
    .contact-header h1 em {
      font-style: italic;
      color: var(--terracotta);
    }
    .contact-header p {
      font-size: 1.05rem;
      line-height: 1.2;
      opacity: 0.75;
      font-weight: 500;
      margin-bottom: 1.6rem;
    }
    .email-line {
      display: flex;
      justify-content: center;
      line-height: 1;
      align-items: baseline;
      gap: 0.5rem;
    }
    .email-line .el-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .email-line .el-val {
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* DIVIDER */
    .divider {
      width: 100%;
      max-width: 620px;
      height: 1px;
      background: rgba(45,53,18,0.15);
      margin-bottom: 2rem;
    }

    /* FORM */
    form {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.3rem;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-field { display: flex; flex-direction: column; gap: 0.45rem; }

    label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bark);
    }
    input, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--white);
      border: 1.5px solid rgba(45,53,18,0.2);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--bark);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: rgba(45,53,18,0.35); }
    input:focus, textarea:focus {
      border-color: var(--bark);
      box-shadow: 0 0 0 3px rgba(166,226,46,0.55);
    }

    /* Email validation */
    input[type="email"].invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255,69,0,0.15);
    }
    .email-hint {
      font-size: 0.78rem;
      color: var(--error);
      font-weight: 500;
      display: none;
      margin-top: 0.2rem;
    }
    .email-hint.visible { display: block; }

    textarea { min-height: 150px; resize: vertical; }

    /* FLOATING LABELS */
    .fl { position: relative; }
    .fl input, .fl textarea { padding: 1.55rem 1rem 0.55rem; }
    .fl textarea { padding-top: 1.75rem; }
    .fl label {
      position: absolute;
      left: 1.05rem;
      top: 1.05rem;
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0;
      text-transform: none;
      color: rgba(45,53,18,0.5);
      pointer-events: none;
      transform-origin: left top;
      transition: top 0.18s ease, font-size 0.18s ease, letter-spacing 0.18s ease, color 0.18s ease;
    }
    .fl input:focus + label,
    .fl input:not(:placeholder-shown) + label,
    .fl textarea:focus + label,
    .fl textarea:not(:placeholder-shown) + label {
      top: 0.5rem;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--terracotta);
    }
    .fl input::placeholder, .fl textarea::placeholder { color: transparent; }

    /* SUBMIT */
    .submit-btn {
      align-self: center;
      background: var(--bark);
      color: var(--cream);
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
      margin-top: 0.3rem;
    }
    .submit-btn:hover { background: var(--lime); color: var(--bark); transform: translateY(-2px); }
    .submit-btn:active { transform: translateY(0); }

    /* SUCCESS */
    #success-msg {
      display: none;
      max-width: 620px;
      width: 100%;
      background: rgba(45,53,18,0.08);
      border: 1.5px solid var(--lime);
      border-radius: 14px;
      padding: 2.4rem;
      text-align: center;
    }
    #success-msg h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 0.5rem; }
    #success-msg p  { font-size: 0.92rem; opacity: 0.7; line-height: 1.7; }

    /* FOOTER */
    footer {
      border-top: 1px solid rgba(45,53,18,0.12);
      padding: 1.8rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer .logo { font-size: 1.2rem; }
    footer p { font-size: 0.76rem; opacity: 0.35; letter-spacing: 0.05em; }

    /* MOBILE */
    @media (max-width: 640px) {
      main { padding: 1.25rem 1.4rem 3rem; }
      nav { padding: 1rem 1.5rem; }
      nav .logo { font-size: 2.6rem; }
      .contact-header { margin-bottom: 1.25rem; }
      .section-label { margin-bottom: 0.8rem; }
      .contact-header h1 { margin-bottom: 0.8rem; }
      .divider { margin-bottom: 1.25rem; }
      form { gap: 1rem; }
      textarea { min-height: 96px; }
      .form-row { grid-template-columns: 1fr; }
      footer { padding: 1.6rem 1.5rem; flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="logo"><span class="co">co</span><span class="mezze">mezze</span></a>
</nav>

<main>
  <div class="contact-header">
    <span class="section-label">Get in touch</span>
    <h1>Thanks for <em style="font-weight:700;">stopping by.</em></h1>
    <div class="email-line">
      <span class="el-label">Email:</span>
      <span class="el-val" id="em"></span>
    </div>
    <script>document.getElementById('em').textContent='contact'+'@'+'comezze.com';</script>
  </div>

  <div class="divider"></div>

  <form id="contact-form"
        action="https://formsubmit.co/contact@comezze.com"
        method="POST">
    <input type="hidden" name="_subject" value="New Comezze Message" />
    <input type="hidden" name="_captcha" value="false" />
    <input type="hidden" name="_next" value="https://comezze.com/?thanks=1" />
    <input type="text" name="_honey" style="display:none" />

    <div class="form-row">
      <div class="form-field fl">
        <input type="text" id="name" name="name" placeholder=" " autocomplete="name" required />
        <label for="name">Your name</label>
      </div>
      <div class="form-field fl">
        <input type="tel" id="phone" name="phone" placeholder=" " autocomplete="tel" />
        <label for="phone">Phone (optional)</label>
      </div>
    </div>

    <div class="form-field">
      <div class="fl">
        <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
        <label for="email">Email address</label>
      </div>
      <span class="email-hint" id="email-hint"></span>
    </div>

    <div class="form-field fl">
      <input type="text" id="subject" name="subject" placeholder=" " required />
      <label for="subject">Subject</label>
    </div>

    <div class="form-field fl">
      <textarea id="message" name="message" placeholder=" " required></textarea>
      <label for="message">Your message…</label>
    </div>

    <button type="submit" class="submit-btn">Send message →</button>
  </form>

  <div id="success-msg">
    <h3>Thank you 🌿</h3>
    <p>We received your message and will reply personally. If you signed up as a tester, keep an eye on your inbox.</p>
  </div>
</main>

<footer>
  <a href="#" class="logo"><span class="co">co</span><span class="mezze">mezze</span></a>
  <p>© 2025 Comezze · comezze.com</p>
</footer>

<script>
  if (location.search.includes('thanks=1')) {
    document.getElementById('contact-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }

  // Email validation
  const emailInput = document.getElementById('email');
  const emailHint  = document.getElementById('email-hint');

  const commonDomains = ['gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','me.com','aol.com','protonmail.com','comezze.com'];
  const domainTypos   = { 'gmial.com':'gmail.com','gmai.com':'gmail.com','gmil.com':'gmail.com','yahooo.com':'yahoo.com','yaho.com':'yahoo.com','hotmial.com':'hotmail.com','hotmai.com':'hotmail.com','outlok.com':'outlook.com' };

  function validateEmail(val) {
    if (!val) { clearHint(); return; }
    const parts = val.split('@');
    if (parts.length !== 2) { showHint('Please include an @ in your email address.'); return; }
    const domain = parts[1].toLowerCase();
    if (!domain) { showHint('Please enter the part after @.'); return; }
    if (!domain.includes('.')) { showHint('Your email is missing a domain ending like .com or .net.'); return; }
    const ext = domain.split('.').pop();
    if (!ext || ext.length < 2) { showHint('Please check your email — the ending looks incomplete.'); return; }
    if (domainTypos[domain]) { showHint('Did you mean ' + parts[0] + '@' + domainTypos[domain] + '?'); return; }
    clearHint();
  }

  function showHint(msg) {
    emailHint.textContent = msg;
    emailHint.classList.add('visible');
    emailInput.classList.add('invalid');
  }
  function clearHint() {
    emailHint.textContent = '';
    emailHint.classList.remove('visible');
    emailInput.classList.remove('invalid');
  }

  emailInput.addEventListener('blur',  () => validateEmail(emailInput.value.trim()));
  emailInput.addEventListener('input', () => { if (emailHint.classList.contains('visible')) validateEmail(emailInput.value.trim()); });
</script>
</body>
</html>
