<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rive Button Test</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #EDECEC;
    font-family: sans-serif;
  }
  .test-wrapper { text-align: center; }
  canvas { cursor: pointer; border: 1px dashed #ccc; }
  #status { white-space: pre-wrap; text-align: left; max-width: 500px; margin: 20px auto; font-size: 14px; }
</style>
</head>
<body>
  <div class="test-wrapper">
    <h2>Rive Button Test</h2>
    <p>You should see the LinkedIn button below:</p>
    <canvas id="rive-linkedin" width="200" height="200" style="width:100px; height:100px;"></canvas>
    <div id="status">Loading Rive...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@latest/rive.js"></script>
  <script>
    var el = document.getElementById('status');
    var canvas = document.getElementById('rive-linkedin');

    var r = new rive.Rive({
      src: 'Icons/button_potfolio_motionthis.riv',
      canvas: canvas,
      autoplay: true,
      stateMachine: 'State Machine 1',
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: function() {
        setTimeout(function() {
          r.resizeDrawingSurfaceToCanvas();
          el.textContent = 'SUCCESS - Rive loaded!\n';
          el.textContent += 'State machines: ' + JSON.stringify(r.stateMachineNames) + '\n';
          el.textContent += 'Animations: ' + JSON.stringify(r.animationNames) + '\n';
          el.style.color = 'green';
        }, 50);
      },
      onStateChange: function(event) {
        el.textContent += 'State: ' + JSON.stringify(event.data) + '\n';
      }
    });

    canvas.addEventListener('click', function() {
      el.textContent += 'Click detected!\n';
    });
  </script>
</body>
</html>
