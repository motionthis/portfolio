<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rive Button Test</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #EDECEC;
    font-family: sans-serif;
  }
  .test-wrapper { text-align: center; max-width: 800px; }
  .buttons {
    display: flex;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    margin: 30px 0;
  }
  .btn-test { text-align: center; }
  .btn-test label { display: block; margin-top: 8px; font-size: 13px; color: #666; }
  canvas { cursor: pointer; border: 1px dashed #ccc; }
  #status { white-space: pre-wrap; text-align: left; margin: 20px auto; font-size: 12px; font-family: monospace; background: #fff; padding: 15px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
  <div class="test-wrapper">
    <h2>Rive Button Test</h2>
    <p>Hover and click each button:</p>
    <div class="buttons">
      <div class="btn-test">
        <canvas id="rive-known" width="300" height="150" style="width:150px; height:75px;"></canvas>
        <label>Known working<br>(Twitter demo button)</label>
      </div>
      <div class="btn-test">
        <canvas id="rive-a" width="200" height="200" style="width:100px; height:100px;"></canvas>
        <label>Your LinkedIn button</label>
      </div>
      <div class="btn-test">
        <canvas id="rive-b" width="200" height="200" style="width:100px; height:100px;"></canvas>
        <label>Your interactive test</label>
      </div>
    </div>
    <div id="status">Initializing...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@latest/rive.js"></script>
  <script>
    var el = document.getElementById('status');
    function log(msg) {
      el.textContent += '\n' + msg;
      el.scrollTop = el.scrollHeight;
    }

    // ── Known working: Twitter demo button from Rive tutorial ──
    var canvasK = document.getElementById('rive-known');
    var btnK = new rive.Rive({
      src: 'Icons/tweeter_button-demo.riv',
      canvas: canvasK,
      autoplay: true,
      artboard: 'Button',
      stateMachine: 'State Machine 1',
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: function() {
        setTimeout(function() {
          btnK.resizeDrawingSurfaceToCanvas();
          var contents = btnK.contents;
          if (contents) log('[Known] Artboards: ' + JSON.stringify(contents.artboards));
          log('[Known] Loaded OK');
        }, 100);
      },
      onStateChange: function(e) { log('[Known] State: ' + JSON.stringify(e.data)); }
    });

    // ── Your LinkedIn button (autoBind for Data Binding) ──
    var canvasA = document.getElementById('rive-a');
    var btnA = new rive.Rive({
      src: 'Icons/button_potfolio_motionthis.riv',
      canvas: canvasA,
      autoplay: true,
      autoBind: true,
      stateMachine: 'State Machine 1',
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: function() {
        setTimeout(function() {
          btnA.resizeDrawingSurfaceToCanvas();
          log('[Yours-A] Loaded with autoBind');
          var vmi = btnA.viewModelInstance;
          if (vmi) {
            log('[Yours-A] ViewModel: ' + vmi.viewModelName);
            log('[Yours-A] Properties: ' + JSON.stringify(vmi.properties));
          } else {
            log('[Yours-A] No ViewModel instance bound!');
          }
        }, 100);
      },
      onStateChange: function(e) { log('[Yours-A] State: ' + JSON.stringify(e.data)); }
    });

    // ── Your interactive test button ──
    var canvasB = document.getElementById('rive-b');
    var btnB = new rive.Rive({
      src: 'Icons/test-button-intracrive.riv',
      canvas: canvasB,
      autoplay: true,
      autoBind: true,
      stateMachine: 'State Machine 1',
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: function() {
        setTimeout(function() {
          btnB.resizeDrawingSurfaceToCanvas();
          log('[Yours-B] Loaded with autoBind');
          var vmi = btnB.viewModelInstance;
          if (vmi) {
            log('[Yours-B] ViewModel: ' + vmi.viewModelName);
            log('[Yours-B] Properties: ' + JSON.stringify(vmi.properties));
          } else {
            log('[Yours-B] No ViewModel instance bound!');
          }
        }, 100);
      },
      onStateChange: function(e) { log('[Yours-B] State: ' + JSON.stringify(e.data)); }
    });

    el.textContent = 'Rive loaded. Waiting for files...';
  </script>
</body>
</html>
