<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rive Button Test</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #EDECEC;
    font-family: sans-serif;
  }
  .test-wrapper {
    text-align: center;
  }
  canvas {
    cursor: pointer;
    border: 1px dashed #ccc;
  }
  #status { white-space: pre-wrap; text-align: left; max-width: 500px; margin: 20px auto; }
</style>
</head>
<body>
  <div class="test-wrapper">
    <h2>Rive Button Test</h2>
    <p>You should see the LinkedIn button below:</p>
    <canvas id="rive-linkedin" width="200" height="200" style="width:100px; height:100px;"></canvas>
    <div id="status">Loading Rive...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@latest/rive.js"></script>
  <script>
    var el = document.getElementById('status');

    function log(msg) {
      el.textContent += '\n' + msg;
      console.log(msg);
    }

    log('Rive runtime version: ' + (rive.RuntimeLoader ? 'loaded' : 'unknown'));

    var r = new rive.Rive({
      src: 'Icons/button_potfolio_motionthis.riv',
      canvas: document.getElementById('rive-linkedin'),
      autoplay: true,
      fit: rive.Fit.Contain,
      alignment: rive.Alignment.Center,
      onLoad: function() {
        r.resizeDrawingSurfaceToCanvas();
        log('SUCCESS - Rive file loaded');

        var contents = r.contents;
        if (contents) {
          log('Artboards: ' + JSON.stringify(contents.artboards));
        }

        var names = r.stateMachineNames;
        log('State machines found: ' + JSON.stringify(names));

        var anims = r.animationNames;
        log('Animations found: ' + JSON.stringify(anims));

        // Try starting state machine by name
        if (names && names.length > 0) {
          r.play(names[0]);
          log('Playing state machine: ' + names[0]);
        }

        el.style.color = 'green';
      },
      onStateChange: function(event) {
        log('State changed: ' + JSON.stringify(event.data));
      }
    });
  </script>
</body>
</html>
